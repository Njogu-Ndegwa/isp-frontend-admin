name: Frontend QA

on:
  push:
    branches: ['codex/qa/**']

permissions:
  contents: read

jobs:
  frontend-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check mobile navigation
        env:
          E2E_PRODUCTION: '1'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/public-demo.spec.ts --workers=1 --grep 'mobile bottom navigation|mobile menu Light Mode'
      - name: Check the installation ledger in a production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3197/api
        run: |
          npm run build
          npx playwright test -c playwright.installation-charges.config.ts
