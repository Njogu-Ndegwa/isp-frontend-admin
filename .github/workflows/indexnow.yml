name: IndexNow ping

# After a push to master, tell Bing and the other IndexNow engines to recrawl
# every URL in the sitemap. ChatGPT search and Copilot answer from Bing's index,
# so without this a new blog post can wait weeks before ChatGPT can cite it.
#
# Runs after Vercel has had time to publish the commit; the script refuses to
# ping if the key file is not live yet, rather than burning the request.

on:
  push:
    branches: [master]
    paths:
      - 'content/blog/**'
      - 'app/landing/**'
      - 'app/pricing/**'
      - 'app/blog/**'
      - 'app/sitemap.ts'
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the deploy to go live
        run: sleep 300
      - name: Ping IndexNow
        run: node scripts/indexnow-ping.mjs
